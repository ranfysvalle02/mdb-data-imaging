services:
  api:
    build: .
    container_name: fastapi_workout_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    # This line makes 'api' wait for 'db' container to start
    depends_on:
      - db
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    # Using 'mongodb/mongodb-community-server' might be simpler if you don't specifically need Atlas Local features right now
    # image: mongodb/mongodb-community-server:latest
    image: mongodb/mongodb-atlas-local:latest # Atlas Local requires more setup (like 'atlas-local init') if not automated
    container_name: mongodb_local
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # Consider adding healthcheck for more robustness (optional)
    # healthcheck:
    #   test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    #   interval: 10s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 40s

volumes:
  mongo_data: